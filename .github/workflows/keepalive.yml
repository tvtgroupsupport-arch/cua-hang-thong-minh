name: Giữ Supabase không bị tạm dừng

# Gói Supabase miễn phí tự tạm dừng sau 7 ngày không có truy cập. Workflow này gọi hàm kiểm tra mỗi 3 ngày.
# Chỉ chạy khi đã tạo hai Secrets: SUPABASE_URL (VD https://abcd.supabase.co) và SUPABASE_ANON_KEY (khoá anon/publishable). Không có thì bỏ qua.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi pos_ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Chưa đặt SUPABASE_URL / SUPABASE_ANON_KEY — bỏ qua."; exit 0; fi
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST "${URL%/}/rest/v1/rpc/pos_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_key":"keepalive-keepalive"}')
          echo "HTTP $code"; cat /tmp/r.json; echo
          [ "$code" = "200" ]

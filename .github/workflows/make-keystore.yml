name: Tạo khoá ký cố định (chạy một lần)

# Mỗi lần build trên GitHub Actions, Gradle tự tạo một khoá ký debug MỚI nên mỗi APK có chữ ký khác nhau và Android không cho cài đè (phải gỡ bản cũ).
# Workflow này tạo một khoá cố định; kết quả (base64) được ghi vào phần chú thích của lần chạy để đưa vào repo (android-debug.keystore.b64).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/make-keystore.yml']

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          keytool -genkeypair -v -keystore /tmp/ks.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          echo "::notice title=KEYSTORE_B64::$(base64 -w0 /tmp/ks.jks)"

name: Build APK Android

# Chạy tay: tab Actions → "Build APK Android" → Run workflow. Tải app-debug.apk ở mục Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Thêm nền tảng Android
        run: test -d android || npx cap add android
      - name: Đồng bộ giao diện + vá AndroidManifest
        run: npm run sync
      - name: Biên dịch APK (debug — cài thẳng được lên điện thoại)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tap-hoa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

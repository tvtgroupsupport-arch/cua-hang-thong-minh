name: Build bản Google Play (AAB)

# Bản RIÊNG dành cho Google Play — package name khác bản APK chuyển khoản (PLAY_APP_ID, xem scripts/write-app-config.mjs).
# Google Play Billing CHỈ hoạt động với app cài qua chính Google Play (kể cả kênh thử nội bộ), không hoạt động với APK cài tay —
# nên bản này cần build file .aab đã KÝ rồi tự tay tải lên Play Console (Internal testing) để thử. Xem HUONG-DAN-GOOGLE-PLAY.md.
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install

      # Plugin mua gói cần bản vá để dùng được ưu đãi dùng thử miễn phí; --strict: plugin đổi phiên bản mà vá không được thì DỪNG (không phát hành bản thiếu vá mà không biết)
      - name: Vá plugin Google Play Billing
        run: node scripts/patch-plugins.mjs --strict

      - name: Ghi cấu hình bản Google Play (billingMode=play, appId riêng)
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_ANON_KEY: ${{ secrets.CENTRAL_SUPABASE_ANON_KEY }}
          BILLING_MODE: play
          PLAY_APP_ID: ${{ vars.PLAY_APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: node scripts/write-app-config.mjs

      - name: Đóng gói cầu nối native
        run: npm run build

      - name: Thêm nền tảng Android
        run: test -d android || npx cap add android

      - name: Tạo biểu tượng Android từ logo (www/icon.svg)
        run: node scripts/make-icons.mjs

      # PHẢI giải mã khoá ký TRƯỚC bước vá bên dưới — script vá build.gradle chỉ thêm cấu hình ký khi thấy android/app/release.keystore.
      - name: Giải mã khoá ký (nếu đã cấu hình)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Đồng bộ vào Android và vá AndroidManifest / ký / R8
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set +e
          npx cap sync android > /tmp/step.log 2>&1; rc=$?
          cat /tmp/step.log
          if [ $rc -ne 0 ]; then echo "::error title=cap sync lỗi::$(tail -c 900 /tmp/step.log | tr '\n' '|' | tr -d '%\r')"; exit $rc; fi
          node scripts/patch-android.mjs > /tmp/step.log 2>&1; rc=$?
          cat /tmp/step.log
          if [ $rc -ne 0 ]; then echo "::error title=patch-android lỗi::$(tail -c 900 /tmp/step.log | tr '\n' '|' | tr -d '%\r')"; exit $rc; fi

      # Có khoá ký → build .aab đã ký, tải thẳng lên Play Console được. Chưa có khoá → build APK debug chỉ để XEM GIAO DIỆN (Billing sẽ KHÔNG hoạt động).
      - name: Biên dịch bản .aab đã ký
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew bundleRelease --no-daemon > /tmp/step.log 2>&1; rc=$?
          tail -n 120 /tmp/step.log
          if [ $rc -ne 0 ]; then echo "::error title=gradle bundleRelease lỗi::$(grep -E 'error|Error|FAILED|What went wrong|Could not|> ' /tmp/step.log | head -c 900 | tr '\n' '|' | tr -d '%\r')"; exit $rc; fi

      - name: Biên dịch APK debug (CHƯA có khoá ký — chỉ xem giao diện, Billing chưa chạy được)
        if: steps.keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          name: tap-hoa-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.has_keystore != 'true'
        with:
          name: tap-hoa-play-debug-apk-XEM-GIAO-DIEN-THOI
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

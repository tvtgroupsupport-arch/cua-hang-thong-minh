<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo Tạp Hóa</title>
<style>body{font:14px system-ui;margin:0;padding:20px;background:#f4f3fb;color:#222}.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px #0001}.dark{background:#14131c;color:#eee}img{display:block}.c{border-radius:50%;overflow:hidden}.sq{border-radius:22%;overflow:hidden}</style></head><body>
<h3>Biểu tượng ứng dụng</h3>
<div class="row"><div class="card"><img src="icon.svg" width="192" height="192"></div><div class="card"><img src="icon.svg" width="96" height="96"></div><div class="card"><img src="icon.svg" width="48" height="48"></div><div class="card"><img src="icon.svg" width="32" height="32"></div>
<div class="card"><div class="c" style="width:96px;height:96px;background:#4f6df5"><img src="icon.svg" width="96" height="96" style="transform:scale(1.25)"></div><small>Cắt tròn (adaptive)</small></div></div>
<h3>Logo ngang</h3>
<div class="row"><div class="card"><img src="logo-lockup.svg" width="420"></div><div class="card dark"><img src="logo-lockup.svg" width="420"></div></div>
<h3>Dấu hiệu (nền trong suốt)</h3>
<div class="row"><div class="card"><img src="logo-mark.svg" width="96"></div><div class="card dark"><img src="logo-mark.svg" width="96"></div><div class="card" style="background:#8b5cf6"><img src="logo-mark.svg" width="96"></div></div>
</body></html>
